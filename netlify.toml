# Deploy target for the finished game. Either connect this folder to Netlify,
# or run `npm run build` and drag the resulting `dist/` onto app.netlify.com.

[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served stale, or a new build cannot
# replace the old one on her phone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Content-hashed assets are safe to keep forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
